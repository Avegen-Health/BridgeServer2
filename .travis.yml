dist: focal
language: java
jdk:
- openjdk8
sudo: required
before_deploy:
  - mvn clean verify
  # Bundle WAR + .platform/hooks/ so EB runs the postdeploy hook on each deploy.
  # Deploying just the WAR (the previous behaviour) excludes .platform/ and the hook never runs.
  - mkdir -p /tmp/eb-bundle/.platform/hooks/postdeploy
  - cp target/BridgeServer2-2.1-SNAPSHOT.war /tmp/eb-bundle/
  - cp .platform/hooks/postdeploy/99_cloudwatch_tomcat.sh /tmp/eb-bundle/.platform/hooks/postdeploy/
  - chmod +x /tmp/eb-bundle/.platform/hooks/postdeploy/99_cloudwatch_tomcat.sh
  - cd /tmp/eb-bundle && zip -r "$TRAVIS_BUILD_DIR/eb-bundle.zip" . && cd -
branches:
  only:
  - develop
  - uat
  - prod
deploy:
  provider: elasticbeanstalk
  edge: true
  access_key_id:
    develop: AKIAJQOD25TNB4GR4LFQ
    uat: AKIAWKBC6B4EQLJ6KI6U
    prod: AKIATMSHFP3OEFUATAP7
  secret_access_key:
    develop:
      secure: ""
    uat:
      secure: ""
    prod:
      secure: ""
  region: us-east-1
  app: BridgeServer2-application
  env: bridgeserver2-$TRAVIS_BRANCH
  bucket:
    develop: org-gvbridge-bridgeserver2-deployment-devdevelop
    uat: org-gvbridge-bridgeserver2-deployment-devstaging
    prod: org-gvbridge-bridgeserver2-deployment-prod
  zip-file: eb-bundle.zip
  on:
    branch: prod
